{% extends "_base.html" %}
{% load static %}

{% block title %}Clientes | Pé na estrada{% endblock%}

{% block content %}
    <table>
        {% for cliente in clientes %}

                <td>{{cliente.nome}}</td> 
                <td>{{cliente.descricao}}</td>

            <td> Nao é clientes cadastrado </td>

            </tr> 
        {% endfor %}
        </table>
{% endblock %}
